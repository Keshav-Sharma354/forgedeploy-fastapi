user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

# Auto-detect optimal CPU affinity bindings
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ==========================================================================
    # Structured JSON Log Format for easy centralized log parsing (Loki / ELK)
    # ==========================================================================
    log_format json_analytics escape=json '{'
        '"timestamp": "$time_iso8601", '
        '"client_ip": "$remote_addr", '
        '"request_id": "$http_x_request_id", '
        '"user": "$remote_user", '
        '"request": "$request", '
        '"status": "$status", '
        '"body_bytes_sent": "$body_bytes_sent", '
        '"referer": "$http_referer", '
        '"user_agent": "$http_user_agent", '
        '"request_time": "$request_time", '
        '"upstream_connect_time": "$upstream_connect_time", '
        '"upstream_header_time": "$upstream_header_time", '
        '"upstream_response_time": "$upstream_response_time", '
        '"upstream_status": "$upstream_status"'
    '}';

    access_log /var/log/nginx/access.log json_analytics;
    error_log /var/log/nginx/error.log warn;

    # ==========================================================================
    # Connection Performance Settings
    # ==========================================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off; # Hides NGINX version number in headers (Security Hardening)

    # Client buffers sizes (prevention of DDoS/buffer overflow attacks)
    client_max_body_size 10M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # ==========================================================================
    # Gzip Optimization
    # ==========================================================================
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Include site-specific configuration files
    include /etc/nginx/conf.d/*.conf;
}
