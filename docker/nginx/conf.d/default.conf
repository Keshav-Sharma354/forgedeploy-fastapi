# Upstream FastAPI application definition
upstream fastapi_server {
    server fastapi:8000;
    keepalive 32; # Keep-alive connection pooling to FastAPI backend
}

# ==============================================================================
# HTTP Server (Port 80)
# Handles Certbot SSL challenge verification and HTTP -> HTTPS redirection
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name localhost; # Will be overridden in production or match default

    # Certbot HTTP challenge location (Let's Encrypt validation)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# HTTPS Server (Port 443)
# Production-ready reverse proxy with strict TLS and Security Hardening
# ==============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name localhost;

    # SSL Certificate Paths
    # Maps to the 'nginx_certs' persistent Docker volume
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # SSL protocols and ciphers (Optimized to modern standards. TLSv1.2 & TLSv1.3 only)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    # SSL Session Caching for performance
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ==========================================================================
    # Strict Production Security Headers
    # ==========================================================================
    # HTTP Strict Transport Security (HSTS) - forces browsers to ONLY load via HTTPS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # Prevent clickjacking attacks
    add_header X-Frame-Options "DENY" always;
    # Prevent MIME-sniffing
    add_header X-Content-Type-Options "nosniff" always;
    # Enable browser Cross-Site Scripting (XSS) filter protection
    add_header X-XSS-Protection "1; mode=block" always;
    # Referrer policy limit
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Strict Content Security Policy (CSP)
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # ==========================================================================
    # Reverse Proxy Locations
    # ==========================================================================
    # FastAPI backend forwarding rules
    location / {
        proxy_pass http://fastapi_server;
        
        # Connection parameters
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Headers forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Unique trace ID mapping
        # Connects the NGINX logs and FastAPI app logs with the exact same Trace ID!
        proxy_set_header X-Request-ID $request_id;
        
        # Timeouts tuning
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Static assets cache optimizations (Gzip & Cache-Control rules)
    location /static/ {
        proxy_pass http://fastapi_server;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
