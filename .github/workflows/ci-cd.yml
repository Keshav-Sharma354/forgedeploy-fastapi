name: Production Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Ensure only one deploy run is active at a time to prevent concurrent lock failures
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/fastapi-app
  DEPLOY_PATH: /home/deployuser/forgedeploy-fastapi

jobs:
  # ============================================================================
  # JOB 1: Continuous Integration (Lint & Test Validation)
  # ============================================================================
  validation:
    name: Code Validation (Lint & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup Python Runtime Environment
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Development Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio httpx -r requirements.txt

      - name: Execute Code Linting Check (Ruff)
        run: |
          # ruff check runs static analysis and syntax validation
          ruff check app/

      - name: Run Testing Suite (Pytest)
        run: |
          # Runs pytests with async capabilities
          pytest app/tests/

  # ============================================================================
  # JOB 2: Build and Push Docker Image (Registry Integration)
  # ============================================================================
  build-and-push:
    name: Build & Push Docker Image
    needs: validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx (Cache & Multiplatform support)
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Image Metadata tags
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,value=${{ github.sha }}

      - name: Compile and Push Production Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha # Employs GitHub Actions native caching for lightning fast layer caching
          cache-to: type=gha,mode=max

  # ============================================================================
  # JOB 3: Continuous Deployment (VPS Secure Delivery)
  # ============================================================================
  deploy:
    name: Deploy to Production VPS
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Remote VPS Deploy Sequence
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            log() { echo -e "\e[1;32m[CI-CD-DEPLOY]\e[0m \$1"; }
            log "Connected to VPS. Navigating to project directory: ${{ env.DEPLOY_PATH }}"
            cd ${{ env.DEPLOY_PATH }}
            
            log "Syncing repository configurations and scripts..."
            git fetch --all
            git reset --hard origin/main
            
            log "Authenticating Docker with GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            
            log "Running container swap and validation scripts..."
            # Execute the deployment runner and verify healthcheck metrics
            chmod +x scripts/*.sh
            ./scripts/deploy.sh
            
            log "Cleaning up old/dangling container caches..."
            docker image prune -f
            
            log "SUCCESS: Deploy successfully completed!"
